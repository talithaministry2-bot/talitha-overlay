const logoImg = new Image();
let logoReady = false;
logoImg.onload = () => { logoReady = true; render(); };
logoImg.src = LOGO_SRC;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---- read state: either from a live-updating blob, or static URL params ----
let remoteState = null; // populated by polling when ?blob=<id> is present

function stateFromParams(p){
  let give = [];
  try{
    const raw = p.get('give');
    if(raw) give = JSON.parse(raw);
  } catch(e){ give = []; }
  return {
    church: (p.get('church') || 'TALITHA MINISTRY').toUpperCase(),
    scripture: p.get('scripture') || '',
    verseText: p.get('verse') || '',
    serviceTitle: p.get('serviceTitle') || '',
    serviceTime: p.get('serviceTime') || '',
    pastor: p.get('pastor') || '',
    pastorTitle: p.get('pastorTitle') || '',
    platform: p.get('platform') || '',
    live: p.get('live') !== '0',
    mode: p.get('mode') || 'info',
    give: give,
  };
}

function currentState(){
  if(remoteState) return remoteState;
  const p = new URLSearchParams(window.location.search);
  return stateFromParams(p);
}

// ---- poll a shared blob for live updates ----
const urlParams = new URLSearchParams(window.location.search);
const blobId = urlParams.get('blob');

async function pollBlob(){
  if(!blobId) return;
  try{
    const res = await fetch('https://jsonblob.com/api/jsonBlob/' + encodeURIComponent(blobId) + '?_=' + Date.now(), {
      cache: 'no-store',
      headers: { 'Accept': 'application/json' }
    });
    if(!res.ok) return;
    const data = await res.json();
    if(data && typeof data === 'object'){
      remoteState = {
        church: (data.church || 'TALITHA MINISTRY').toUpperCase(),
        scripture: data.scripture || '',
        verseText: data.verseText || '',
        serviceTitle: data.serviceTitle || '',
        serviceTime: data.serviceTime || '',
        pastor: data.pastor || '',
        pastorTitle: data.pastorTitle || '',
        platform: data.platform || '',
        live: data.live !== false,
        mode: data.mode || 'info',
        give: Array.isArray(data.give) ? data.give : [],
      };
      render();
    }
  } catch(e){ /* keep showing last known state on any network hiccup */ }
}

if(blobId){
  pollBlob();
  setInterval(pollBlob, 5000);
}

// ---- helpers ----
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function drawSpacedText(text, x, y, font, spacing, fillStyle, strokeStyle, strokeWidth, align){
  ctx.font = font;
  ctx.textBaseline = 'alphabetic';
  let total = 0;
  for(const ch of text){ total += ctx.measureText(ch).width + spacing; }
  total -= spacing;
  let cx = x;
  if(align === 'center') cx = x - total/2;
  if(align === 'right') cx = x - total;
  for(const ch of text){
    if(strokeWidth>0){
      ctx.lineWidth = strokeWidth;
      ctx.strokeStyle = strokeStyle;
      ctx.lineJoin = 'round';
      ctx.miterLimit = 2;
      ctx.strokeText(ch, cx, y);
    }
    ctx.fillStyle = fillStyle;
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + spacing;
  }
  return total;
}

function fitFontSize(text, family, weight, maxWidth, startSize, minSize, spacing){
  let size = startSize;
  while(size > minSize){
    ctx.font = `${weight} ${size}px ${family}`;
    let total = 0;
    for(const ch of text){ total += ctx.measureText(ch).width + spacing; }
    total -= spacing;
    if(total <= maxWidth) break;
    size -= 2;
  }
  return size;
}

function wrapText(text, font, maxWidth, maxLines){
  ctx.font = font;
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for(const w of words){
    const test = cur ? cur + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && cur){
      lines.push(cur);
      cur = w;
    } else {
      cur = test;
    }
    if(lines.length >= maxLines) break;
  }
  if(cur && lines.length < maxLines) lines.push(cur);
  let truncated = false;
  if(lines.length === maxLines){
    const consumed = lines.join(' ').length;
    if(consumed < text.length) truncated = true;
  }
  if(truncated){
    let last = lines[lines.length-1];
    while(ctx.measureText(last + '…').width > maxWidth && last.length > 0){
      last = last.slice(0, -1);
    }
    lines[lines.length-1] = last.trimEnd() + '…';
  }
  return lines;
}

// ---- main render ----
function render(){
  const s = currentState();
  const mode = s.mode;
  ctx.clearRect(0,0,W,H);

  const GOLD = '#c9a34a';
  const GOLD_LIGHT = '#e2c273';
  const NAVY = '#0b1a20';
  const NAVY_SOFT = 'rgba(11,26,32,.90)';
  const WHITE = '#f5f5f0';
  const MUTE = 'rgba(245,245,240,.72)';

  // ================= CORNER BUG (top-left) =================
  const badgeR = 58;
  const bugCX = 78, bugCY = 84;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)';
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 4;
  ctx.beginPath();
  ctx.arc(bugCX, bugCY, badgeR, 0, Math.PI*2);
  ctx.fillStyle = NAVY_SOFT;
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(bugCX, bugCY, badgeR, 0, Math.PI*2);
  ctx.lineWidth = 2;
  ctx.strokeStyle = GOLD;
  ctx.stroke();

  if(logoReady){
    const logoSize = badgeR*1.6;
    ctx.save();
    ctx.beginPath();
    ctx.arc(bugCX, bugCY, badgeR-6, 0, Math.PI*2);
    ctx.clip();
    ctx.drawImage(logoImg, bugCX-logoSize/2, bugCY-logoSize/2, logoSize, logoSize);
    ctx.restore();
  }

  const nameX = bugCX + badgeR + 22;
  ctx.font = '600 26px Inter, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillText(s.church, nameX+1, bugCY+1);
  ctx.fillStyle = WHITE;
  ctx.fillText(s.church, nameX, bugCY);

  // ================= TOP-RIGHT: LIVE + service line =================
  let cursorY = 56;
  if(s.live){
    const bw = 108, bh = 38;
    const bx = W-48-bw;
    roundRect(ctx, bx, cursorY-bh+8, bw, bh, 6);
    ctx.fillStyle = 'rgba(11,26,32,.72)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bx+22, cursorY-bh/2+8, 6, 0, Math.PI*2);
    ctx.fillStyle = '#c0392b';
    ctx.fill();
    ctx.font = '700 18px Inter, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = WHITE;
    ctx.fillText('LIVE', bx+38, cursorY-bh/2+15);
    cursorY += bh + 14;
  }
  let svcLine = [s.serviceTitle, s.serviceTime].filter(Boolean).join('  ·  ');
  if(svcLine){
    ctx.font = '600 24px Inter, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.fillText(svcLine, W-47, cursorY+1);
    ctx.fillStyle = WHITE;
    ctx.fillText(svcLine, W-48, cursorY);
    cursorY += 30;
  }
  if(s.platform){
    ctx.font = '500 18px Inter, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = MUTE;
    ctx.fillText(s.platform, W-48, cursorY);
  }
  ctx.textAlign = 'left';

  // ================= LOWER THIRD =================
  const barX = 64;
  const barW = mode === 'giving' ? 1180 : (mode === 'scripture' ? 1300 : 940);
  const kickerH = 40;
  const gap = 6;
  const padX = 34;

  let verseLines = [];
  const verseFont = 'italic 600 32px Lora, serif';
  const quotePadX = padX + 54;
  if(mode === 'scripture'){
    const text = s.verseText.trim();
    if(text){
      verseLines = wrapText(text, verseFont, barW - quotePadX - padX, 3);
    }
  }

  const barH = mode === 'scripture'
    ? (verseLines.length ? 54 + verseLines.length*42 + 20 : 128)
    : 128;
  const barY = H - 90 - barH;
  const kickerY = barY - gap - kickerH;

  let kickerText = mode === 'giving' ? 'PARTNERSHIP & GIVING' : (s.scripture || '');
  if(kickerText){
    ctx.font = '700 20px Inter, sans-serif';
    const kw = Math.min(ctx.measureText(kickerText.toUpperCase()).width + 44, barW);
    roundRect(ctx, barX, kickerY, kw, kickerH, 4);
    ctx.fillStyle = GOLD;
    ctx.fill();
    ctx.fillStyle = NAVY;
    ctx.textAlign = 'left';
    ctx.fillText(kickerText.toUpperCase(), barX+22, kickerY+kickerH/2+7);
  }

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.35)';
  ctx.shadowBlur = 20;
  ctx.shadowOffsetY = 8;
  roundRect(ctx, barX, barY, barW, barH, 3);
  ctx.fillStyle = NAVY_SOFT;
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = GOLD;
  ctx.fillRect(barX, barY, barW, 3);

  if(mode === 'info'){
    const leftColW = barW * 0.62;
    let pastorName = s.pastor || 'Preacher name here';
    let pastorTitle = (s.pastorTitle || '').toUpperCase();

    const nameSize = fitFontSize(pastorName, 'Lora, serif', 700, leftColW-padX*2, 42, 26, 0.5);
    ctx.font = `700 ${nameSize}px Lora, serif`;
    ctx.fillStyle = WHITE;
    ctx.textAlign = 'left';
    ctx.fillText(pastorName, barX+padX, barY+58);

    if(pastorTitle){
      drawSpacedText(pastorTitle, barX+padX, barY+92, '600 20px Inter, sans-serif', 1.6, GOLD_LIGHT, null, 0, 'left');
    }

    ctx.strokeStyle = 'rgba(245,245,240,.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(barX+leftColW, barY+22);
    ctx.lineTo(barX+leftColW, barY+barH-22);
    ctx.stroke();

    const rx = barX+leftColW+30;
    ctx.font = '700 24px Inter, sans-serif';
    ctx.fillStyle = WHITE;
    ctx.fillText(s.serviceTitle || 'Sunday Service', rx, barY+56);
    ctx.font = '500 20px Inter, sans-serif';
    ctx.fillStyle = MUTE;
    ctx.fillText(s.serviceTime || '', rx, barY+86);

  } else if(mode === 'scripture'){
    ctx.textAlign = 'left';
    if(verseLines.length){
      ctx.font = '700 84px Georgia, "Times New Roman", serif';
      ctx.fillStyle = GOLD;
      ctx.fillText('\u201C', barX+padX-6, barY+66);

      ctx.font = verseFont;
      ctx.fillStyle = WHITE;
      let ly = barY + 50;
      for(const line of verseLines){
        ctx.fillText(line, barX+quotePadX, ly);
        ly += 42;
      }
    }
  } else {
    const rows = (s.give || []).filter(r => r.method || r.details);
    const n = Math.max(rows.length, 1);
    const innerW = barW - padX*2;
    const colW = innerW / n;

    rows.forEach((r, i) => {
      const cx = barX + padX + colW*i;
      ctx.textAlign = 'left';
      ctx.font = '700 21px Inter, sans-serif';
      ctx.fillStyle = GOLD_LIGHT;
      ctx.fillText((r.method || 'Method').toUpperCase(), cx, barY+52);
      ctx.font = '600 25px Inter, sans-serif';
      ctx.fillStyle = WHITE;
      ctx.fillText(r.details || '—', cx, barY+86);

      if(i>0){
        ctx.strokeStyle = 'rgba(245,245,240,.22)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx-20, barY+20);
        ctx.lineTo(cx-20, barY+barH-20);
        ctx.stroke();
      }
    });
  }
  ctx.textAlign = 'left';
}

render();
window.addEventListener('resize', render);
</script>
</body>
</html>
